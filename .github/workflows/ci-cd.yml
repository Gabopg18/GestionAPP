name: Django CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build-and-test:
    name: Integración Continua (CI)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout del código fuente
      uses: actions/checkout@v4

    - name: Configurar entorno Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Instalar dependencias del proyecto
      run: |
        python -m pip install --upgrade pip
        # Instalación de dependencias
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install flake8 pytest pytest-django

    - name: Análisis de calidad de código (Linting con flake8)
      run: |
        # Detener la construcción si hay errores críticos de sintaxis
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Mostrar advertencias pero sin detener el proceso
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Configuración de Base de Datos (SQLite) y Migraciones
      run: |
        python manage.py makemigrations
        python manage.py migrate

    - name: Ejecutar Pruebas Unitarias
      run: |
        # Ejecutar suite de pruebas de Django
        python manage.py test

  deploy:
    name: Despliegue Continuo (CD)
    needs: build-and-test
    runs-on: ubuntu-latest
    # Solo ejecutar el despliegue si se hace un push/merge a la rama main o master
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Checkout del código fuente
      uses: actions/checkout@v4

    - name: Despliegue a servidor (Simulación Hosting Bajo Costo)
      run: |
        echo "================================================="
        echo "Iniciando proceso de despliegue automatizado..."
        echo "================================================="
        echo "[1/4] Conectando al servidor de producción vía SSH..."
        sleep 1
        echo "[2/4] Sincronizando código fuente más reciente..."
        sleep 1
        echo "[3/4] Aplicando migraciones en base de datos..."
        sleep 1
        echo "[4/4] Reiniciando servicio web..."
        echo "================================================="
        echo "¡Despliegue completado con éxito! El sistema está en línea."
